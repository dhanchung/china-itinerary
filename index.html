<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guangzhou, Shenzhen and Hong Kong, 21 to 28 Nov 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4;--surface:#FFFFFF;--ink:#17201D;--muted:#56625D;--line:#D6DDD9;
  --gz:#1E6B57;--sz:#2B5F8E;--hk:#B23B32;--gz-soft:#E2F0EA;--sz-soft:#E3ECF5;--hk-soft:#F7E5E3;
  --focus:#2B5F8E;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513;--surface:#18211E;--ink:#E7EEEA;--muted:#9BA7A2;--line:#2B3632;
    --gz:#62C2A1;--sz:#86B5E0;--hk:#E57D73;--gz-soft:#1B3029;--sz-soft:#1B2836;--hk-soft:#35201E;--focus:#86B5E0;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513;--surface:#18211E;--ink:#E7EEEA;--muted:#9BA7A2;--line:#2B3632;
  --gz:#62C2A1;--sz:#86B5E0;--hk:#E57D73;--gz-soft:#1B3029;--sz-soft:#1B2836;--hk-soft:#35201E;--focus:#86B5E0;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 64px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,7vw,44px);line-height:1.05;letter-spacing:-0.02em;margin:8px 0 6px}
header p{margin:0;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
nav.views{display:flex;gap:4px;margin:22px 0 18px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
nav.views button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted)}
nav.views button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tickets{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.ticket{scroll-snap-align:start;flex:0 0 auto;width:92px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0;cursor:pointer;position:relative;overflow:hidden}
.ticket .stub{display:block;height:6px;background:var(--c)}
.ticket .inner{display:block;padding:8px 10px 10px;border-top:1px dashed var(--line)}
.ticket .wd{display:block;font-size:13px;color:var(--muted)}
.ticket .dn{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1}
.ticket .ct{display:block;font-size:12px;color:var(--c);font-weight:600}
.ticket[aria-selected="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.ticket .today{position:absolute;top:10px;right:8px;font-size:11px;font-weight:600;background:var(--c);color:var(--surface);padding:1px 6px;border-radius:6px}
.dayhead{margin:8px 0 18px}
.dayhead h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin:0 0 4px;letter-spacing:-0.01em}
.dayhead .city{display:inline-block;font-size:13px;font-weight:600;color:var(--c);background:var(--soft);padding:2px 10px;border-radius:999px;margin-bottom:8px}
.dayhead p{margin:0;color:var(--muted);max-width:62ch}
ol.timeline{list-style:none;margin:0;padding:0;position:relative}
ol.timeline li{display:grid;grid-template-columns:64px 18px minmax(0,1fr);gap:0 10px;position:relative;padding-bottom:18px}
ol.timeline li .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;padding-top:1px}
ol.timeline li .rail{position:relative}
ol.timeline li .rail::before{content:"";position:absolute;left:8px;top:0;bottom:-18px;width:2px;background:var(--line)}
ol.timeline li:last-child .rail::before{bottom:auto;height:14px}
ol.timeline li .rail::after{content:"";position:absolute;left:3px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--c)}
.stop h3{margin:0;font-size:17px;font-weight:600;line-height:1.35}
.stop p{margin:3px 0 0;color:var(--muted);font-size:15px;max-width:60ch}
.zhbtn{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:14px;cursor:pointer}
.zhcard{margin-top:8px;background:var(--soft);border:1px solid var(--c);border-radius:10px;padding:14px 16px}
.zhcard .zh{font-family:var(--zh);font-size:30px;line-height:1.3;font-weight:600;color:var(--ink);word-break:keep-all}
.zhcard .en{font-size:13px;color:var(--muted);margin-top:4px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500}
.pager button[disabled]{opacity:.4;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:4px 12px 12px 4px;padding:16px 18px;margin-bottom:14px}
.card h2{font-family:var(--display);font-size:21px;margin:0 0 2px}
.card .meta{color:var(--muted);font-size:14px;margin:0 0 10px}
.card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.progress{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gz);width:0;transition:width .25s}
.progress span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.group{margin-bottom:18px}
.group h2{font-family:var(--display);font-size:19px;margin:0 0 6px}
.group label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.group input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--gz);flex:none}
.group input:checked + span{color:var(--muted);text-decoration:line-through}
.reset{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:15px}
.chips button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.nearlead{margin:0 0 16px;color:var(--muted);max-width:62ch}
.cat{margin:0 0 20px}
.cat h2{font-family:var(--display);font-size:19px;margin:0 0 4px}
.place{padding:12px 0;border-bottom:1px solid var(--line)}
.place h3{margin:0;font-size:16px;font-weight:600}
.place p{margin:3px 0 0;color:var(--muted);font-size:15px;max-width:60ch}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Guangzhou, Shenzhen and Hong Kong</h1>

<script>
const CITY={gz:{name:"Guangzhou",c:"var(--gz)",s:"var(--gz-soft)"},sz:{name:"Shenzhen",c:"var(--sz)",s:"var(--sz-soft)"},hk:{name:"Hong Kong day trip",c:"var(--hk)",s:"var(--hk-soft)"}};
const DAYS=[
{date:"2026-11-21",wd:"Sat",long:"Saturday 21 November",city:"gz",title:"Arrival, rest and Animation Star City",lead:"An early landing, a slow morning around the hotel, a rest, then the underground anime mall and Beijing Road in the evening.",stops:[

["08:00","Dim sum breakfast near the hotel","Teahouses open early. Pick one around Beijing Road."],
["10:00","Beijing Road pedestrian street","Right outside the hotel. Snacks, shops and the ancient road layers under glass.","北京路步行街"],

{date:"2026-11-22",wd:"Sun",long:"Sunday 22 November",city:"gz",title:"Old town and the Pearl River",lead:"The old-town day, all along Metro Line 1, ending with Shamian at dusk and the river cruise near the hotel.",stops:[
["08:00","Rice rolls and congee in Liwan","Yinji Changfen or a local congee shop near Dishifu Road. Line 1 to Changshou Lu. Quick, cheap and very local.","银记肠粉"],
["10:00","Chen Clan Ancestral Hall","Line 1 to Chen Jia Ci. Lingnan wood carving and stone sculpture; allow 1 to 1.5 hours.","陈家祠"],
["12:30","Yongqing Fang and Enning Road","Line 1 to Changshou Lu. Lunch on street snacks: rice noodle rolls, then double-skin milk at Nanxin.","永庆坊"],
["16:00","Shamian Island","Line 1 to Huangsha. Colonial-era streets; stay as the buildings light up at dusk.","沙面"],
["18:00","Dinner","Around Shamian or back near Beijing Road."],
["19:30","Pearl River night cruise","Board at Tianzi Wharf, about a 10 to 15 min walk from the hotel. Cruises run about an hour.","天字码头"]]},
{date:"2026-11-23",wd:"Mon",long:"Monday 23 November",city:"gz",title:"Tao Tao Ju, Tianhe malls and Canton Tower",lead:"Yum cha at Tao Tao Ju, Yuexiu Park, anime and character stores in Tianhe, sunset from Canton Tower, then dinner in the old town.",stops:[

["12:00","Grandview Mall, Tianhe","Line 2 back to Gongyuanqian, then Line 1 to Tiyu Xilu. Look for the Gundam Base and character stores (Sanrio, Pokémon, Bandai); check they're still open before you go. Grandview also has an indoor aquarium.","正佳广场"],
["13:00","Lunch in Tianhe","Food courts in Grandview or Tee Mall, or Cantonese at a Bingsheng branch nearby."],

["20:45","Shangxiajiu pedestrian street","A short walk from the restaurant. Evening snacks, then Line 1 back to the hotel.","上下九步行街"]]},

["09:30","Dongshankou","Line 1 three stops east to Dongshankou. Red-brick villas, lifestyle cafés and small art spaces.","东山口"],
["12:00","Lunch in Dongshankou","Plenty of cafés and casual restaurants in the lanes."],
["14:00","Guangdong Museum","Line 1 to Tiyu Xilu, then Line 3 one stop to Zhujiang New Town and a short walk. Reserve a time slot with your passports.","广东省博物馆"],
["17:00","Animation Star City or Beijing Road","Back at Gongyuanqian for last gachapon and merchandise.","动漫星城"],
["19:00","Huifu East Road food street","Walking distance from the hotel. Pack tonight for the morning train.","惠福东路美食街"]]},

["12:00","Lunch","Plenty of cheap eats around Zhenhua Road."],
["13:30","Huaqiangbei electronics malls","Short walk from the hotel. Phones, drones, gadgets and parts. Malls close around early evening.","华强北"],
["16:30","Bit City","Anime-themed underground passage at Convention and Exhibition Center station: claw machines, anime cafés and merchandise. Check it's open before you go.","次元小镇"],

["22:00","Fill in China arrival cards","One each, for re-entering from Hong Kong tomorrow."]]},
{date:"2026-11-26",wd:"Thu",long:"Thursday 26 November",city:"hk",title:"Hong Kong: the Peak, then Mong Kok",lead:"Sights in the morning while it's quiet, Mong Kok's collector malls in the afternoon once the shops open. Bring everyone's physical passports.",stops:[
["07:15","Breakfast at the hotel","Free breakfast at the Hampton. Check the opening time at check-in so you can eat before leaving."],
["08:00","Leave the hotel","Line 2 or Didi to Futian station.","深圳福田站"],
["08:30","High-speed train to Hong Kong West Kowloon","About 15 to 20 min. Both immigration checks are done inside West Kowloon station.","香港西九龙站"],
["09:30","Star Ferry to Central","Taxi about 10 min from West Kowloon to the Tsim Sha Tsui pier, then cross the harbour.","天星小輪"],
["10:30","Peak Tram to Victoria Peak","Morning queues are shorter and the view is often clearer.","山頂纜車"],
["12:30","Lunch in Central","Wonton noodles at Mak's Noodle, and egg tarts at Tai Cheong Bakery.","麥奀雲吞麵世家"],

["14:30","Sino Centre and nearby collector malls","Figures, consignment display boxes, manga and manhwa. Also look for Animate and CTMA Centre nearby; check locations and hours before you go.","信和中心"],
["17:00","Sneakers Street and Ladies' Market","Fa Yuen Street sneakers and Tung Choi Street stalls.","花園街"],
["18:30","Dinner in Mong Kok or Tsim Sha Tsui","Try Australia Dairy Company in Jordan on the way."],
["20:30","Train back to Futian","Taxi to West Kowloon station. Book the return in advance and check the last train time.","香港西九龍站"]]},
{date:"2026-11-27",wd:"Fri",long:"Friday 27 November",city:"sz",title:"Dongmen comics, street food and Shenzhen Bay",lead:"Anime and card shops at Dongmen in the morning, a street-food lunch, a rest, then Shenzhen Bay before sunset and seafood in Shekou.",stops:[
["09:00","Breakfast at the hotel","Free breakfast at the Hampton, then an easy start since the shops open late."],
["10:30","Dongmen Comic City","Line 1 two stops east to Laojie (or Line 3 to Shaibu). Figure shops, Pokémon card lounges and local cosplayers. Shops open around late morning.","东门步行街"],
["12:30","Street-food lunch at Dongmen","Grilled skewers, rice rolls, fried snacks and bubble tea."],
["13:30","Dongmen Pedestrian Street","Budget fashion, shoes and small shops. Bargain at the stalls.","东门步行街"],
["15:00","Back to the hotel","Drop off shopping bags and rest.","福田区振华路60号"],
["16:30","Shenzhen Bay Park","About 30 min by Didi. Walk the waterfront before sunset, with views across to Hong Kong.","深圳湾公园"],
["18:30","Seafood dinner in Shekou","Short Didi to Sea World for harbour-side seafood, then back to the hotel.","海上世界"]]},
{date:"2026-11-28",wd:"Sat",long:"Saturday 28 November",city:"sz",title:"Fly home",lead:"An early start for a 1pm flight: a quick breakfast and an optional park visit, then leave for the airport by 09:30.",stops:[
["07:00","Breakfast at the hotel","Free breakfast at the Hampton. Pack bags the night before."],
["07:45","Lianhuashan Park (optional)","About 10 min by Didi. A short climb gives the view over Futian. Skip it if everyone's tired.","莲花山公园"],

["09:30","To Shenzhen Bao'an Airport (SZX)","Didi 40 to 50 min, easiest with luggage. Metro Line 11 also runs to the airport in about 40 min.","深圳宝安国际机场"],
["10:30","Check in for the flight to Singapore","Aim to be at the airport about 2.5 hours before departure."],
["13:00","Fly home","Have lunch airside after security."]]}
];
const HOTELS=[
{city:"gz",name:"Crystal Hotel Guangzhou",nights:"4 nights, Sat 21 to Wed 25 Nov",addr:"Zhonglv Commercial City, 219 Zhongshan 5th Road, Yuexiu District",zh:"越秀区中山五路219号",metro:"Gongyuanqian (Lines 1 and 2)",near:"Beijing Road, Huifu East Road, Tianzi Wharf"},
{city:"sz",name:"Hampton by Hilton",nights:"3 nights, Wed 25 to Sat 28 Nov",addr:"1st Floor, Languang Building, 60 Zhenhua Road, Futian District",zh:"福田区振华路60号",metro:"Huaqiangbei area (Line 2 to Futian station; Line 1 at Huaqiang Road)",near:"Huaqiangbei electronics malls, Zhenhua Road food"}
];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function store(get,key,val){try{if(get)return localStorage.getItem(key);localStorage.setItem(key,val)}catch(e){return null}}

let cur=0;
const now=new Date();const todayIso=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
const todayIdx=DAYS.findIndex(d=>d.date===todayIso);
if(todayIdx>=0)cur=todayIdx;else{const saved=parseInt(store(true,"trip-day"),10);if(saved>=0&&saved<DAYS.length)cur=saved;}

function renderTickets(){
  $("#tickets").innerHTML=DAYS.map((d,i)=>{const c=CITY[d.city];const dn=d.date.slice(8);
    return `<button class="ticket" role="tab" aria-selected="${i===cur}" data-i="${i}" style="--c:${c.c}" aria-label="${esc(d.long)}, ${esc(c.name)}">
      <span class="stub"></span><span class="inner"><span class="wd">${d.wd} Nov</span><span class="dn">${dn}</span><span class="ct">${d.city==="hk"?"Hong Kong":c.name}</span></span>${i===todayIdx?'<span class="today">Today</span>':""}</button>`}).join("");
  $("#tickets").querySelectorAll(".ticket").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.i)));
}
function renderDay(){
  const d=DAYS[cur],c=CITY[d.city];
  $("#day").innerHTML=`<div class="dayhead" style="--c:${c.c};--soft:${c.s}"><span class="city">${esc(c.name)}</span><h2>${esc(d.long)}: ${esc(d.title)}</h2><p>${esc(d.lead)}</p></div>
  <ol class="timeline" style="--c:${c.c};--soft:${c.s}">${d.stops.map((s,j)=>`<li><div class="t">${esc(s[0])}</div><div class="rail" aria-hidden="true"></div><div class="stop"><h3>${esc(s[1])}</h3><p>${esc(s[2])}</p>${s[3]?`<button class="zhbtn" aria-expanded="false" data-j="${j}">Show in Chinese</button><div class="zhcard" hidden><div class="zh" lang="zh-Hans">${esc(s[3])}</div><div class="en">${esc(s[1])}</div></div>`:""}</div></li>`).join("")}</ol>`;
  $("#day").querySelectorAll(".zhbtn").forEach(b=>b.addEventListener("click",()=>{const card=b.nextElementSibling;const open=card.hidden;card.hidden=!open;b.setAttribute("aria-expanded",String(open));b.textContent=open?"Hide Chinese":"Show in Chinese";}));
  $("#prev").disabled=cur===0;$("#next").disabled=cur===DAYS.length-1;
}
function go(i){cur=Math.max(0,Math.min(DAYS.length-1,i));store(false,"trip-day",String(cur));renderTickets();renderDay();
  const t=$("#tickets").children[cur];if(t)t.scrollIntoView({block:"nearest",inline:"nearest"});}
$("#prev").addEventListener("click",()=>go(cur-1));
$("#next").addEventListener("click",()=>go(cur+1));

function renderHotels(){
  $("#hotels").innerHTML=HOTELS.map((h,i)=>{const c=CITY[h.city];return `<div class="card" style="--c:${c.c};--soft:${c.s}"><h2>${esc(h.name)}</h2><p class="meta">${esc(c.name)}, ${esc(h.nights)}</p>
  <dl><dt>Address</dt><dd>${esc(h.addr)}</dd><dt>Metro</dt><dd>${esc(h.metro)}</dd><dt>Nearby</dt><dd>${esc(h.near)}</dd></dl>
  <button class="zhbtn" aria-expanded="false">Show in Chinese</button><div class="zhcard" hidden><div class="zh" lang="zh-Hans">${esc(h.zh)}</div><div class="en">${esc(h.addr)}</div></div></div>`}).join("");
  $("#hotels").querySelectorAll(".zhbtn").forEach(b=>b.addEventListener("click",()=>{const card=b.nextElementSibling;const open=card.hidden;card.hidden=!open;b.setAttribute("aria-expanded",String(open));b.textContent=open?"Hide Chinese":"Show in Chinese";}));
}


const tabs=[["tab-days","view-days"],["tab-hotels","view-hotels"]];
tabs.forEach(([t,v])=>$("#"+t).addEventListener("click",()=>{tabs.forEach(([t2,v2])=>{$("#"+t2).setAttribute("aria-selected",String(t2===t));$("#"+v2).hidden=t2!==t;});}));

renderTickets();renderDay();renderHotels();
</script>
</body>
</html>
